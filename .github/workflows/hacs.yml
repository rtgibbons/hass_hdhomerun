name: HACS eligibility

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        env:
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
