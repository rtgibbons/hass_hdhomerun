name: Validate

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -c 'import json; print("\n".join(json.load(open("custom_components/hdhomerun/manifest.json"))["requirements"]))' > /tmp/integration-requirements.txt
          python -m pip install -r /tmp/integration-requirements.txt
      - name: Ruff
        run: ruff check custom_components tests --output-format github
      - name: Tests
        run: python -m pytest -q tests

  dashboard:
    name: Dashboard (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Node version
        run: node --version
      - name: Dashboard tests
        run: node --test tests/test_dashboard*.mjs

  hassfest:
    name: "Hassfest"
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        env:
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
