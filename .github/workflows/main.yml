name: Build & Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

run-name: "Prepare release ${{ github.ref_name }}"

permissions:
  contents: read

env:
  ARTIFACT_PATH: artifacts
  PACKAGE_NAME: hdhomerun

jobs:
  validate:
    name: Validate release
    uses: ./.github/workflows/validate.yml

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # HACS and manual installs use the same versioned release ZIP.
      - name: Verify release source
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = Path("custom_components") / os.environ["PACKAGE_NAME"] / "manifest.json"
          version = json.loads(manifest.read_text())["version"]
          tag = os.environ["RELEASE_TAG"]
          number = r"(?:0|[1-9][0-9]*)"
          if not re.fullmatch(rf"{number}\.{number}\.{number}(?:b{number})?", tag):
              raise SystemExit("Use an x.y.z or x.y.zbN tag without a v prefix")
          if version != tag:
              raise SystemExit(f"Manifest version {version!r} must match release tag {tag!r}")
          if not (Path("docs/releases") / f"{tag}.md").is_file():
              raise SystemExit(f"Release blocked: missing curated notes for {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"prerelease={'true' if 'b' in tag else 'false'}\n")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Release tags must point to commits on main.' >&2
            exit 1
          }

      - name: Prepare artifacts location
        run: |
          mkdir -p "$ARTIFACT_PATH"

      # Archive only committed runtime files, never local caches or build output.
      - name: Create the zip file
        run: |
          git archive --format=zip --output="$ARTIFACT_PATH/$PACKAGE_NAME.zip" \
            "$GITHUB_SHA:custom_components/$PACKAGE_NAME"
          if [ -f LICENSE ]; then
            zip -j "$ARTIFACT_PATH/$PACKAGE_NAME.zip" LICENSE
          fi

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.PACKAGE_NAME }}"
          path: "${{ env.ARTIFACT_PATH }}"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: "${{ env.PACKAGE_NAME }}"
          path: "${{ env.ARTIFACT_PATH }}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.ARTIFACT_PATH }}/${{ env.PACKAGE_NAME }}.zip
          fail_on_unmatched_files: true
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          prerelease: ${{ needs.build.outputs.prerelease }}
